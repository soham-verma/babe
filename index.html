<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>babe. — annoying girlfriend simulator</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#140c1c" />
  <meta name="description" content="You sat down to play one game. She sat down on the controller. Survive the night." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <section id="title-screen" class="screen active">
      <div class="stars" aria-hidden="true"></div>
      <div class="title-card">
        <p class="eyebrow">one night. zero peace.</p>
        <h1>babe.</h1>
        <p class="tagline">an annoying girlfriend simulator</p>
        <div id="missions" class="missions" role="group" aria-label="Choose a mission"></div>
        <p class="pitch" id="pitch"></p>
        <label class="name-field">
          <span>she calls you</span>
          <input id="player-name" maxlength="16" placeholder="babe" value="babe" autocomplete="off" />
        </label>
        <button id="start-btn" class="btn primary">start the night</button>
        <p class="hint">there are no correct answers. only consequences.</p>
      </div>
      <div class="title-nori" aria-hidden="true">
        <div class="nori pose-peek mood-smile" data-nori></div>
      </div>
    </section>

    <section id="game-screen" class="screen">
      <header class="hud">
        <div class="clock-wrap">
          <div class="clock" id="clock">8:00 PM</div>
          <div class="goal" id="goal">until 2:00 AM</div>
        </div>
        <div class="meters">
          <div class="meter hearts" title="Nori's mood">
            <span class="meter-label">nori</span>
            <div class="bar"><i id="hearts-bar"></i></div>
            <span class="meter-val" id="hearts-val">70</span>
          </div>
          <div class="meter sanity" title="Your sanity">
            <span class="meter-label">you</span>
            <div class="bar"><i id="sanity-bar"></i></div>
            <span class="meter-val" id="sanity-val">80</span>
          </div>
        </div>
        <button id="mute-btn" class="icon-btn" aria-label="Mute">sound</button>
      </header>

      <div class="stage">
        <div class="room scene-couch" id="room">
          <div class="window">
            <div class="city"></div>
            <div class="moon"></div>
          </div>
          <div class="tv" id="tv">
            <canvas id="mini" width="320" height="180"></canvas>
            <div class="tv-ui">
              <span id="tv-title">SLIME KNIGHT</span>
              <span id="tv-score">0</span>
            </div>
            <div class="paused-stamp" id="paused-stamp">PAUSED BY NORI</div>
            <div class="scanlines"></div>
          </div>
          <div class="lamp"></div>
          <div class="couch"></div>
          <div class="player-body" aria-hidden="true"></div>
          <div id="nori-stage" class="nori pose-idle mood-smile" data-nori></div>
          <div class="snack" id="snack"></div>
        </div>
        <aside class="portrait-wrap">
          <div class="portrait-frame">
            <div id="nori-portrait" class="nori pose-bust mood-smile" data-nori></div>
            <div class="nametag">NORI</div>
          </div>
        </aside>
      </div>

      <div id="dialogue" class="dialogue">
        <div class="speech">
          <p id="speech-text"></p>
          <p class="stage-dir" id="stage-dir"></p>
        </div>
        <div id="choices" class="choices"></div>
      </div>
    </section>

    <section id="phone-screen" class="overlay hidden">
      <div class="phone">
        <div class="phone-notch"></div>
        <div class="phone-head">
          <div class="phone-ava"></div>
          <div>
            <strong id="phone-name">nori ♡</strong>
            <small id="phone-status">active now · obviously</small>
          </div>
        </div>
        <div id="thread" class="thread"></div>
        <div id="phone-choices" class="phone-choices"></div>
      </div>
    </section>

    <section id="ending-screen" class="screen">
      <div class="ending-card" id="ending-card">
        <p class="eyebrow" id="ending-kicker"></p>
        <h2 id="ending-title"></h2>
        <p id="ending-body"></p>
        <ul class="stats" id="ending-stats"></ul>
        <div class="ending-actions">
          <button id="retry-btn" class="btn primary">play again</button>
          <button id="again-btn" class="btn ghost">pick another mission</button>
        </div>
      </div>
    </section>
  </div>

  <template id="nori-svg">
    <svg class="nori-svg" viewBox="0 0 220 300" role="img" aria-label="Nori">
      <defs>
        <linearGradient id="hairGrad" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0%" stop-color="#ff9ec8" />
          <stop offset="100%" stop-color="#c77dff" />
        </linearGradient>
        <linearGradient id="hoodGrad" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#fff6ea" />
          <stop offset="100%" stop-color="#e9d5c3" />
        </linearGradient>
      </defs>
      <g class="nori-root">
        <ellipse class="shadow" cx="110" cy="286" rx="54" ry="10" fill="rgba(0,0,0,.28)" />
        <g class="hair-back">
          <path d="M42 118 C38 48 78 22 110 22 C152 22 186 52 180 122 C176 168 168 188 158 210 L62 210 C54 176 46 150 42 118Z" fill="url(#hairGrad)" />
        </g>
        <g class="body">
          <path d="M70 168 C68 210 60 250 58 278 L162 278 C160 250 152 210 150 168 C136 176 120 180 110 180 C98 180 84 176 70 168Z" fill="url(#hoodGrad)" />
          <path d="M78 176 C90 168 130 168 142 176 C138 198 128 214 110 216 C92 214 82 198 78 176Z" fill="#f7e6d4" opacity=".7" />
          <circle cx="110" cy="156" r="28" fill="#f3c7b3" />
        </g>
        <g class="arms">
          <path class="arm-l" d="M70 178 C48 200 42 236 58 252 C70 244 78 220 84 198Z" fill="url(#hoodGrad)" />
          <path class="arm-r" d="M150 178 C172 200 178 236 162 252 C150 244 142 220 136 198Z" fill="url(#hoodGrad)" />
          <ellipse class="hand-l" cx="58" cy="254" rx="12" ry="10" fill="#f3c7b3" />
          <ellipse class="hand-r" cx="162" cy="254" rx="12" ry="10" fill="#f3c7b3" />
        </g>
        <g class="legs">
          <rect x="78" y="268" width="18" height="24" rx="8" fill="#f3c7b3" />
          <rect x="124" y="268" width="18" height="24" rx="8" fill="#f3c7b3" />
          <ellipse cx="87" cy="292" rx="16" ry="8" fill="#fff6ea" />
          <ellipse cx="133" cy="292" rx="16" ry="8" fill="#fff6ea" />
        </g>
        <g class="head">
          <ellipse cx="110" cy="118" rx="52" ry="56" fill="#f3c7b3" />
          <g class="blush">
            <ellipse cx="76" cy="132" rx="10" ry="6" fill="#ff8fab" opacity=".55" />
            <ellipse cx="144" cy="132" rx="10" ry="6" fill="#ff8fab" opacity=".55" />
          </g>
          <g class="eyes">
            <g class="eye-l">
              <ellipse cx="88" cy="116" rx="10" ry="12" fill="#2b1b38" />
              <circle cx="91" cy="112" r="3.2" fill="#fff" />
              <ellipse class="shine-extra" cx="85" cy="118" rx="1.6" ry="2" fill="#fff" opacity=".7" />
            </g>
            <g class="eye-r">
              <ellipse cx="132" cy="116" rx="10" ry="12" fill="#2b1b38" />
              <circle cx="135" cy="112" r="3.2" fill="#fff" />
            </g>
            <g class="heart-eyes" opacity="0">
              <path d="M88 118 l-9 -8 a5.5 5.5 0 1 1 9 -5 a5.5 5.5 0 1 1 9 5 z" fill="#ff4d6d" />
              <path d="M132 118 l-9 -8 a5.5 5.5 0 1 1 9 -5 a5.5 5.5 0 1 1 9 5 z" fill="#ff4d6d" />
            </g>
            <g class="closed-eyes" opacity="0">
              <path d="M78 116 Q88 122 98 116" stroke="#2b1b38" stroke-width="3" fill="none" stroke-linecap="round" />
              <path d="M122 116 Q132 122 142 116" stroke="#2b1b38" stroke-width="3" fill="none" stroke-linecap="round" />
            </g>
            <g class="side-eyes" opacity="0">
              <ellipse cx="94" cy="116" rx="9" ry="11" fill="#2b1b38" />
              <ellipse cx="138" cy="116" rx="9" ry="11" fill="#2b1b38" />
              <circle cx="97" cy="112" r="2.6" fill="#fff" />
              <circle cx="141" cy="112" r="2.6" fill="#fff" />
            </g>
          </g>
          <g class="brows">
            <path class="brow-l" d="M76 98 Q88 94 100 98" stroke="#5a3a68" stroke-width="3" fill="none" stroke-linecap="round" />
            <path class="brow-r" d="M120 98 Q132 94 144 98" stroke="#5a3a68" stroke-width="3" fill="none" stroke-linecap="round" />
          </g>
          <g class="mouth">
            <path class="mouth-smile" d="M100 142 Q110 150 120 142" stroke="#c45c6a" stroke-width="3" fill="none" stroke-linecap="round" />
            <path class="mouth-pout" d="M104 146 Q110 140 116 146" stroke="#c45c6a" stroke-width="3" fill="none" stroke-linecap="round" opacity="0" />
            <ellipse class="mouth-open" cx="110" cy="146" rx="6" ry="5" fill="#c45c6a" opacity="0" />
            <path class="mouth-flat" d="M102 146 H118" stroke="#c45c6a" stroke-width="3" fill="none" stroke-linecap="round" opacity="0" />
          </g>
          <g class="tears" opacity="0">
            <ellipse cx="76" cy="130" rx="3" ry="6" fill="#8ecae6" />
            <ellipse cx="146" cy="132" rx="3" ry="7" fill="#8ecae6" />
          </g>
          <g class="hair-front">
            <path d="M58 100 C62 48 90 28 110 30 C138 28 164 52 164 96 C150 70 130 62 110 64 C88 62 70 74 58 100Z" fill="url(#hairGrad)" />
            <path d="M54 92 C48 120 58 140 70 148 C62 120 60 104 54 92Z" fill="#c77dff" />
            <path d="M166 92 C172 120 162 140 150 148 C158 120 160 104 166 92Z" fill="#ff9ec8" />
            <path d="M88 44 C96 58 92 78 86 90" stroke="#ffd6ea" stroke-width="3" fill="none" opacity=".5" />
          </g>
          <g class="clip">
            <rect x="138" y="48" width="16" height="8" rx="3" transform="rotate(-18 146 52)" fill="#ffe066" />
            <path d="M146 44 l3 7 l-8 0 z" fill="#ffe066" transform="rotate(-18 146 52)" />
          </g>
          <g class="anger" opacity="0">
            <path d="M150 70 l10 0 l-8 8 l10 0" stroke="#ff4d6d" stroke-width="3" fill="none" />
          </g>
          <g class="zzz" opacity="0">
            <text x="168" y="70" fill="#fff" font-size="16" font-family="Fredoka, sans-serif">z</text>
            <text x="180" y="54" fill="#fff" font-size="20" font-family="Fredoka, sans-serif">z</text>
          </g>
          <g class="phone-prop" opacity="0">
            <rect x="148" y="200" width="28" height="46" rx="6" fill="#1b1224" />
            <rect x="152" y="206" width="20" height="34" rx="2" fill="#ff8fab" />
          </g>
        </g>
      </g>
    </svg>
  </template>

  <script src="events.js"></script>
  <script src="missions.js"></script>
  <script src="game.js"></script>
</body>
</html>
